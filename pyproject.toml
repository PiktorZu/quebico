[project]
name = "quebico"
version = "0.1.0.dev0"
description = "Record the reasoning that connects your project — goals, decisions, premises — as a graph you can put to work."
readme = "README.md"
authors = [
    { name = "PiktorZu" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
quebico = "quebico.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Markdown here is records and prose, not code to lint or format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
